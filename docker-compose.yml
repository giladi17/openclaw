# הרצה בלי Kubernetes — שרת אחד קטן (Oracle Free / VPS / מחשב בבית)
#   cp .env.example .env   # למלא מפתחות
#   docker compose up -d --build
#
# brain  — מאזין לטלגרם ודוחף משימות לתור ב-Redis
# runner — מריץ את המשימות מהתור + סריקות בוקר/ערב (מחליף את ה-Jobs וה-CronJobs)

services:
  # השם redis-service זהה ל-Service ב-K8s, כך שהקוד עובד בשתי הפריסות בלי שינוי
  redis-service:
    image: redis:7.2-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    restart: unless-stopped

  brain:
    build: ./brain
    env_file: .env
    environment:
      RUNNER: queue
      # רק הצ'אטים האלה רשאים לתת פקודות לבוט
      ALLOWED_CHAT_IDS: ${TELEGRAM_CHAT_ID}
    depends_on:
      - redis-service
    restart: unless-stopped
    mem_limit: 512m

  runner:
    build: ./agent
    command: ["python", "runner.py"]
    env_file: .env
    depends_on:
      - redis-service
    restart: unless-stopped
    mem_limit: 1g
