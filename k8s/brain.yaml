apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-brain
  namespace: default
spec:
  replicas: 1
  # בוט טלגרם ב-polling — אסור ששני עותקים ירוצו במקביל (Telegram מחזיר Conflict)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openclaw-brain
  template:
    metadata:
      labels:
        app: openclaw-brain
    spec:
      serviceAccountName: brain-sa
      # רץ על ה-control-plane לפי label, לא לפי hostname קבוע — שורד יצירה מחדש של השרת
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: openclaw-brain
        image: giladi17/openclaw-brain:latest   # ה-CI מחליף לתגית של ה-commit
        env:
        - name: TELEGRAM_TOKEN
          valueFrom:
            secretKeyRef:
              name: openclaw-secrets
              key: TELEGRAM_TOKEN
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: openclaw-secrets
              key: GROQ_API_KEY
        # רק הצ'אט הזה רשאי לתת פקודות לבוט (אפשר כמה, מופרדים בפסיק)
        - name: ALLOWED_CHAT_IDS
          valueFrom:
            secretKeyRef:
              name: openclaw-secrets
              key: TELEGRAM_CHAT_ID
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: AGENT_IMAGE
          value: giladi17/openclaw-agent:latest   # ה-CI מחליף לתגית של ה-commit
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # ה-Brain כותב /tmp/heartbeat כל 30 שניות. אם הקובץ ישן מ-2 דקות — התהליך תקוע.
        livenessProbe:
          exec:
            command:
            - python3
            - -c
            - "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/heartbeat') < 120 else 1)"
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - test
            - -f
            - /tmp/heartbeat
          initialDelaySeconds: 10
          periodSeconds: 15
