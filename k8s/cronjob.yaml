# שעות לפי שעון ניו יורק — מתעדכן אוטומטית בין שעון קיץ לחורף (נתמך מ-K8s 1.27)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openclaw-morning
  namespace: default
spec:
  # שני-שישי 9:35 — 5 דקות אחרי הפתיחה, כדי לא לקנות בתנודתיות של דקת הפתיחה
  schedule: "35 9 * * 1-5"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # בלי ניסיונות חוזרים — ניסיון שני יכול לקנות שוב את אותן מניות
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: openclaw-agent
        spec:
          restartPolicy: Never
          serviceAccountName: agent-sa
          automountServiceAccountToken: false
          imagePullSecrets:
          - name: dockerhub-secret
          containers:
          - name: scheduler
            image: giladi17/openclaw-agent:latest
            env:
            - name: ROLE
              value: "scanner"
            - name: TASK
              value: "morning_scan"
            - name: CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: TELEGRAM_CHAT_ID
            - name: TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: TELEGRAM_TOKEN
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: GROQ_API_KEY
            - name: ALPACA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: ALPACA_API_KEY
            - name: ALPACA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: ALPACA_SECRET_KEY
            - name: ALPACA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: ALPACA_BASE_URL
            resources:
              requests:
                memory: "256Mi"
                cpu: "250m"
              limits:
                memory: "512Mi"
                cpu: "500m"
---
