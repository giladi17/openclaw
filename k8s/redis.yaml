apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine   # גרסה קבועה (GETDEL דורש Redis 6.2+)
        ports:
        - containerPort: 6379
        # חובה: ה-ResourceQuota ב-namespace דוחה פודים בלי requests/limits,
        # אז בלי זה Redis לא היה עולה מחדש אחרי restart
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: default
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
